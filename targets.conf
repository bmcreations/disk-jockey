# disk-jockey targets. One per line:
#   tier|id|os|paths|action|busy|note
#
# tier    1 = pure cache, regenerates automatically, near-zero cost
#         2 = regenerates, but costs a re-download or a slow rebuild
#         3 = report only. May hold data that cannot be regenerated. Never deleted by scripts.
# os      any | mac | linux | win   (win = Git Bash on Windows)
# paths   comma-separated; ~, globs and %WINDOWS_VAR% (e.g. %LOCALAPPDATA%) allowed; "-" for none (cmd targets)
#         Deletable paths must be under $HOME, or two levels inside /tmp, /private/tmp, /var/tmp or $TMPDIR
#         and owned by you. Anything else is report-only whatever the action says.
# action  rm            delete every matched path
#         stale:DAYS    delete matched paths with nothing inside modified or installed in DAYS days
#         cmd:COMMAND   run the tool's own cleanup command (skipped if the tool is not installed)
#         report        size only, never deleted
# busy    comma-separated pgrep -f patterns (no "|"). Target is skipped while any matches. "-" for none.
#
# Add your own lines. Every script reads this file, so new targets get the same guards.
# Do not use "|" inside commands or patterns.

