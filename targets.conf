# disk-jockey targets. One per line:
#   tier|id|os|paths|action|busy|note
#
# tier    1 = pure cache, regenerates automatically, near-zero cost
#         2 = regenerates, but costs a re-download or a slow rebuild
#         3 = report only. May hold data that cannot be regenerated. Never deleted by scripts.
# os      any | mac | linux
# paths   comma-separated; ~ and globs allowed; "-" for none (cmd targets)
# action  rm            delete every matched path
#         stale:DAYS    delete matched paths with nothing inside modified or installed in DAYS days
#         cmd:COMMAND   run the tool's own cleanup command (skipped if the tool is not installed)
#         report        size only, never deleted
# busy    comma-separated pgrep -f patterns (no "|"). Target is skipped while any matches. "-" for none.
#
# Add your own lines. Every script reads this file, so new targets get the same guards.
# Do not use "|" inside commands or patterns.

# ---------------- Tier 1: caches ----------------
1|xcode-deriveddata|mac|~/Library/Developer/Xcode/DerivedData/*|stale:7|xcodebuild|Xcode build output per project path (every agent worktree gets its own folder)
1|xctest-devices|mac|~/Library/Developer/XCTestDevices/*|rm|xcodebuild|Simulator clones from parallel test runs; agents leave a set per run
1|xcode-previews|mac|~/Library/Developer/Xcode/UserData/Previews|rm|XCPreviewAgent|SwiftUI preview simulators
1|coresim-caches|mac|~/Library/Developer/CoreSimulator/Caches|rm|Simulator.app,launchd_sim|Simulator dyld caches
1|sim-unavailable|mac|-|cmd:xcrun simctl delete unavailable|-|Simulators whose runtime is no longer installed
1|avd-quickboot-snapshots|any|~/.android/avd/*.avd/snapshots|rm|qemu-system|Emulator quickboot snapshots; next boot is a cold boot
1|gradle-build-cache|any|~/.gradle/caches/build-cache-1|rm|GradleDaemon|Gradle local build cache
1|gradle-old-versions|any|~/.gradle/caches/[0-9]*,~/.gradle/caches/transforms-*,~/.gradle/caches/jars-*|stale:30|GradleDaemon|Caches for Gradle versions unused for 30d
1|gradle-tmp|any|~/.gradle/.tmp|rm|GradleDaemon|Gradle scratch files
1|gradle-daemon-logs|any|~/.gradle/daemon/*|stale:14|-|Daemon logs for Gradle versions unused for 14d
1|kotlin-daemon|mac|~/Library/Application Support/kotlin/daemon|stale:7|KotlinCompileDaemon|Kotlin daemon logs
1|android-cache|any|~/.android/cache|rm|sdkmanager|SDK manager download cache
1|npm-cache|any|~/.npm/_cacache|cmd:npm cache clean --force|npm install,npm ci|npm download cache
1|pnpm-store|any|~/Library/pnpm/store,~/.local/share/pnpm/store|cmd:pnpm store prune|pnpm install,pnpm add,pnpm i |pnpm packages no project references
1|yarn-cache|any|~/Library/Caches/Yarn,~/.cache/yarn|cmd:yarn cache clean|yarn install,yarn add|Yarn classic cache
1|bun-cache|any|~/.bun/install/cache|rm|bun install,bun add|Bun install cache
1|pip-cache|any|~/Library/Caches/pip,~/.cache/pip|cmd:pip3 cache purge|pip3? install|pip wheel cache
1|uv-cache|any|~/.cache/uv|cmd:uv cache prune|uv pip,uv sync,uv add,uv run|Unused uv cache entries
1|go-build-cache|any|~/Library/Caches/go-build,~/.cache/go-build|cmd:go clean -cache|go build,go test|Go build cache
1|brew-cleanup|mac|~/Library/Caches/Homebrew|cmd:brew cleanup --prune=all|brew install,brew upgrade|Old formula versions and downloads
1|docker-build-cache|any|-|cmd:docker builder prune -f --filter until=168h|docker build|Docker build cache older than 7d
1|playwright-old|any|~/Library/Caches/ms-playwright/*,~/.cache/ms-playwright/*|stale:30|-|Browser builds unused for 30d (each Playwright upgrade adds a new set)
1|puppeteer-old|any|~/.cache/puppeteer/*/*|stale:30|-|Puppeteer browser builds unused for 30d
1|android-studio-old|any|~/Library/Caches/Google/AndroidStudio*,~/.cache/Google/AndroidStudio*|stale:30|studio|Caches of Android Studio versions unused for 30d
1|jetbrains-old|any|~/Library/Caches/JetBrains/*,~/.cache/JetBrains/*|stale:30|idea,goland,pycharm,webstorm,rustrover,clion|Caches of JetBrains IDE versions unused for 30d
1|thumbnails|linux|~/.cache/thumbnails|rm|-|Desktop thumbnail cache; regenerated on demand
1|flatpak-unused|linux|~/.local/share/flatpak|cmd:flatpak uninstall --unused -y --user|flatpak install,flatpak update|Flatpak runtimes no user app needs

# ---------------- Tier 2: costs a re-download or rebuild ----------------
2|xcode-device-support|mac|~/Library/Developer/Xcode/iOS DeviceSupport/*,~/Library/Developer/Xcode/watchOS DeviceSupport/*|stale:60|-|Device symbols; re-copied on next connect of that iOS version
2|gradle-modules|any|~/.gradle/caches/modules-2|rm|GradleDaemon|All downloaded dependencies; next build re-downloads everything
2|gradle-wrapper-dists|any|~/.gradle/wrapper/dists/*|stale:45|GradleDaemon|Gradle distributions unused for 45d
2|konan-old|any|~/.konan/kotlin-native-prebuilt-*|stale:60|konan,KotlinCompileDaemon|Kotlin/Native toolchains unused for 60d
2|maven-repo|any|~/.m2/repository|rm|mvn|Maven local repository
2|cocoapods-cache|mac|~/Library/Caches/CocoaPods|cmd:pod cache clean --all|pod install,pod update|CocoaPods download cache
2|swiftpm-cache|mac|~/Library/Caches/org.swift.swiftpm|rm|swift-build,swift-package|SwiftPM repository cache
2|cargo-cache|any|~/.cargo/registry/cache,~/.cargo/registry/src,~/.cargo/git/checkouts|rm|cargo|Crate archives and extracted sources
2|go-mod-cache|any|~/go/pkg/mod|cmd:go clean -modcache|go build,go test,go mod|Go module cache
2|docker-dangling|any|-|cmd:docker image prune -f|docker build|Untagged Docker images
2|podman-dangling|any|-|cmd:podman image prune -f|podman build,podman run|Untagged Podman images
2|podman-build-cache|any|-|cmd:podman builder prune -f|podman build|Podman build cache

# ---------------- Tier 3: report only ----------------
3|xcode-installs|mac|/Applications/Xcode*.app|report|-|Each Xcode is 10G+; remove betas or old versions you no longer select
3|xcode-archives|mac|~/Library/Developer/Xcode/Archives|report|-|Holds dSYMs for shipped builds; crash symbolication breaks without them
3|simulators|mac|~/Library/Developer/CoreSimulator/Devices|report|-|Simulator app data; remove per device with xcrun simctl delete UDID
3|sim-runtimes|mac|/Library/Developer/CoreSimulator/Volumes,/Library/Developer/CoreSimulator/Images|report|-|Simulator runtimes; xcrun simctl runtime list / delete
3|swift-toolchains|mac|~/Library/Developer/Toolchains|report|-|Downloaded Swift toolchains; remove ones you no longer select
3|android-avds|any|~/.android/avd|report|qemu-system|Emulators including installed app data; delete unused ones in Device Manager
3|android-system-images|any|~/Library/Android/sdk/system-images,~/Android/Sdk/system-images|report|-|Emulator images; sdkmanager --uninstall unused ones
3|android-ndk|any|~/Library/Android/sdk/ndk,~/Android/Sdk/ndk|report|-|Side-by-side NDK versions
3|docker-vm|mac|~/Library/Containers/com.docker.docker/Data,~/.orbstack|report|-|Container VM disk; inspect with docker system df -v
3|agent-state|any|~/.claude/projects,~/.claude/jobs,~/.codex/sessions,~/.gemini/tmp|report|-|Agent transcripts and session history (resume depends on these)
3|claude-desktop|mac|~/Library/Application Support/Claude|report|-|Desktop app VM bundles and build data; managed by the app
3|ml-models|any|~/.cache/huggingface,~/.ollama/models,~/.lmstudio/models,~/Models|report|-|Downloaded models; expensive to re-fetch
3|trash|mac|~/.Trash|report|-|Empty manually
3|trash-linux|linux|~/.local/share/Trash|report|-|Empty manually
3|container-storage|linux|~/.local/share/containers,~/.local/share/docker|report|-|Rootless Podman/Docker storage; prune with podman/docker system prune
3|snap-revisions|linux|/var/lib/snapd/snaps|report|-|Old snap revisions; sudo snap set system refresh.retain=2, then remove disabled revisions
3|journal|linux|/var/log/journal|report|-|System logs; sudo journalctl --vacuum-size=500M
3|apt-cache|linux|/var/cache/apt/archives|report|-|Downloaded packages; sudo apt-get clean
3|dnf-cache|linux|/var/cache/dnf,/var/cache/libdnf5|report|-|Downloaded packages; sudo dnf clean all
3|pacman-cache|linux|/var/cache/pacman/pkg|report|-|Downloaded packages; sudo paccache -r
3|downloads|any|~/Downloads|report|-|Review manually
